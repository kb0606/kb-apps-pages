<svg xmlns="http://www.w3.org/2000/svg" width="1798" height="875" viewBox="0 0 1798 875">
  <title>Tile Trails feature graphic</title>
  <defs>
    <!-- Outer hex: 72 × 84. Inner colored hex: 64 × 76. All coordinates are integers. -->
    <path id="hex-outer" d="M0 -42 L36 -21 L36 21 L0 42 L-36 21 L-36 -21 Z"/>
    <path id="hex-inner" d="M0 -38 L32 -19 L32 19 L0 38 L-32 19 L-32 -19 Z"/>
  </defs>
  <image href="background.png" x="0" y="0" width="1798" height="875" preserveAspectRatio="none"/>
  <!-- A continuous trail of outlined hex tiles, shaded from teal to lime. -->
  <g id="trail-tiles">
    <!-- Edit the two shared paths above to resize every tile. Centers use a 72px horizontal step or a (36px, 63px) diagonal step. -->
    <g transform="translate(31 786)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#059b97"/></g>
    <g transform="translate(67 849)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#079e98"/></g>
    <g transform="translate(139 849)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#08a199"/></g>
    <g transform="translate(211 849)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#08a199"/></g>
    <g transform="translate(247 786)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#08a199"/></g>
    <g transform="translate(211 723)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#0aa995"/></g>
    <g transform="translate(247 660)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#0aa995"/></g>
    <g transform="translate(319 660)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#0aa995"/></g>
    
    <!-- <g transform="translate(283 723)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#0cad90"/></g> -->
    <!-- <g transform="translate(355 723)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#10b18a"/></g> -->
    <g transform="translate(391 660)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#15b584"/></g>
    <g transform="translate(427 597)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g>
    <g transform="translate(499 597)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g>
    <g transform="translate(535 660)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g>
    <g transform="translate(607 660)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g>
    <g transform="translate(643 597)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g>
    <!-- <g transform="translate(607 534)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g> -->
    <g transform="translate(679 534)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g>
    <g transform="translate(751 534)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g>
