    <!-- <g transform="translate(715 471)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g> -->
    <g transform="translate(787 471)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g>

    <!-- <g transform="translate(391 534)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g> -->
    <!-- <g transform="translate(463 534)"><use href="#hex-outer" fill="#fff"/><use href="#hex-inner" fill="#1bb97c"/></g> -->
    
